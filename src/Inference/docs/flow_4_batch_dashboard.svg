<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Batch dashboard flow</title><desc>The browser loads the dashboard page, which calls two API endpoints; both use batch_metrics to read scored_applicants.parquet from each BatchOutput folder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect.box{fill:#F1EFE8;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th,.c-purple>.t{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style></defs>
<rect x="0" y="0" width="680" height="490" fill="#FFFFFF"/>
<g><rect class="box" x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">localhost:8001/ui/</text></g>
<line x1="340" y1="76" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="100" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">web/dashboard/index.html</text>
<text class="ts" x="340" y="136" text-anchor="middle" dominant-baseline="central">Page asks the API for data</text></g>
<path d="M300 156 L300 176 L190 176 L190 198" class="arr" marker-end="url(#arrow)"/>
<path d="M380 156 L380 176 L490 176 L490 198" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="200" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="218" text-anchor="middle" dominant-baseline="central">GET /api/runs</text>
<text class="ts" x="190" y="236" text-anchor="middle" dominant-baseline="central">Every batch, for trend lines</text></g>
<g class="c-purple"><rect x="360" y="200" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="218" text-anchor="middle" dominant-baseline="central">GET /api/snapshot/{date}</text>
<text class="ts" x="490" y="236" text-anchor="middle" dominant-baseline="central">One batch vs the one before</text></g>
<line x1="190" y1="256" x2="190" y2="288" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="256" x2="490" y2="288" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="290" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="308" text-anchor="middle" dominant-baseline="central">batch_metrics</text>
<text class="ts" x="190" y="326" text-anchor="middle" dominant-baseline="central">list_batch_runs, snapshot_metrics</text></g>
<g class="c-teal"><rect x="360" y="290" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="308" text-anchor="middle" dominant-baseline="central">batch_metrics</text>
<text class="ts" x="490" y="326" text-anchor="middle" dominant-baseline="central">snapshot_metrics, compare_runs</text></g>
<line x1="190" y1="346" x2="190" y2="378" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="346" x2="490" y2="378" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="140" y="380" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="398" text-anchor="middle" dominant-baseline="central">BatchOutput/&lt;date&gt;/</text>
<text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">scored_applicants.parquet (read only)</text></g>
<rect class="c-purple" x="70" y="460" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="88" y="466" dominant-baseline="central">Web page / API</text>
<rect class="c-teal" x="230" y="460" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="248" y="466" dominant-baseline="central">Shared code (utils)</text>
<rect class="box" x="470" y="460" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="488" y="466" dominant-baseline="central">Browser / data</text>
</svg>
