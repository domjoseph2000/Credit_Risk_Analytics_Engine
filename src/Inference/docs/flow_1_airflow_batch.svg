<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img"><title>Airflow batch inference flow</title><desc>inference_batch_dag waits for application.csv, builds features for six tables in parallel, joins them, then scores, summarises and explains, writing three files to BatchOutput.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect.box{fill:#F1EFE8;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th,.c-purple>.t{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style></defs>
<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>
<g><rect class="box" x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Trigger inference_batch_dag</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">application_date param (or run date)</text></g>
<line x1="340" y1="76" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="100" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">wait_for_raw_data</text>
<text class="ts" x="340" y="136" text-anchor="middle" dominant-baseline="central">Waits up to 1 h for application.csv</text></g>
<line x1="340" y1="156" x2="340" y2="178" class="arr" marker-end="url(#arrow)"/>
<rect x="60" y="180" width="560" height="150" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="340" y="200" text-anchor="middle" dominant-baseline="central">Six build tasks, in parallel</text>
<g class="c-purple"><rect x="80" y="214" width="160" height="40" rx="6" stroke-width="0.5"/><text class="t" x="160" y="234" text-anchor="middle" dominant-baseline="central">application</text></g>
<g class="c-purple"><rect x="260" y="214" width="160" height="40" rx="6" stroke-width="0.5"/><text class="t" x="340" y="234" text-anchor="middle" dominant-baseline="central">bureau</text></g>
<g class="c-purple"><rect x="440" y="214" width="160" height="40" rx="6" stroke-width="0.5"/><text class="t" x="520" y="234" text-anchor="middle" dominant-baseline="central">previous app.</text></g>
<g class="c-purple"><rect x="80" y="262" width="160" height="40" rx="6" stroke-width="0.5"/><text class="t" x="160" y="282" text-anchor="middle" dominant-baseline="central">POS cash</text></g>
<g class="c-purple"><rect x="260" y="262" width="160" height="40" rx="6" stroke-width="0.5"/><text class="t" x="340" y="282" text-anchor="middle" dominant-baseline="central">installments</text></g>
<g class="c-purple"><rect x="440" y="262" width="160" height="40" rx="6" stroke-width="0.5"/><text class="t" x="520" y="282" text-anchor="middle" dominant-baseline="central">credit card</text></g>
<text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">Each runs features/&lt;table&gt;.py → saves &lt;table&gt;.parquet</text>
<line x1="340" y1="330" x2="340" y2="352" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="354" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central">join_features</text>
<text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">merge_feature_frames → feature matrix</text></g>
<line x1="340" y1="410" x2="340" y2="432" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="434" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="452" text-anchor="middle" dominant-baseline="central">score_features</text>
<text class="ts" x="340" y="470" text-anchor="middle" dominant-baseline="central">Calls the shared scoring code</text></g>
<path d="M300 490 L300 502 L135 502 L135 512" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="490" x2="340" y2="512" class="arr" marker-end="url(#arrow)"/>
<path d="M380 490 L380 502 L545 502 L545 512" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="514" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="532" text-anchor="middle" dominant-baseline="central">score_applicants</text>
<text class="ts" x="135" y="550" text-anchor="middle" dominant-baseline="central">PD → score → band</text></g>
<g class="c-teal"><rect x="245" y="514" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="532" text-anchor="middle" dominant-baseline="central">build_band_summary</text>
<text class="ts" x="340" y="550" text-anchor="middle" dominant-baseline="central">Per-band counts, means</text></g>
<g class="c-teal"><rect x="450" y="514" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="532" text-anchor="middle" dominant-baseline="central">explain_contributions</text>
<text class="ts" x="545" y="550" text-anchor="middle" dominant-baseline="central">SHAP reason codes</text></g>
<path d="M135 570 L135 584 L220 584 L220 598" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="570" x2="340" y2="598" class="arr" marker-end="url(#arrow)"/>
<path d="M545 570 L545 584 L460 584 L460 598" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="140" y="600" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="618" text-anchor="middle" dominant-baseline="central">BatchOutput/&lt;date&gt;/</text>
<text class="ts" x="340" y="636" text-anchor="middle" dominant-baseline="central">scored_applicants · band_summary · reason_codes</text></g>
<rect class="c-purple" x="70" y="674" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="88" y="680" dominant-baseline="central">Airflow task</text>
<rect class="c-teal" x="230" y="674" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="248" y="680" dominant-baseline="central">Shared code (utils, features)</text>
<rect class="box" x="470" y="674" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="488" y="680" dominant-baseline="central">Trigger / data</text>
</svg>
