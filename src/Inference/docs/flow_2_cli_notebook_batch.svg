<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img"><title>Command-line and notebook batch scoring flow</title><desc>score_model_input.py or Batch_Inference.ipynb load raw tables, assemble features, score, then summarise and explain, writing to BatchOutput.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect.box{fill:#F1EFE8;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th,.c-purple>.t{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style></defs>
<rect x="0" y="0" width="680" height="590" fill="#FFFFFF"/>
<g class="c-purple"><rect x="80" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="38" text-anchor="middle" dominant-baseline="central">score_model_input.py</text>
<text class="ts" x="200" y="56" text-anchor="middle" dominant-baseline="central">CLI: --application-date</text></g>
<g class="c-purple"><rect x="360" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="38" text-anchor="middle" dominant-baseline="central">Batch_Inference.ipynb</text>
<text class="ts" x="480" y="56" text-anchor="middle" dominant-baseline="central">Same steps, cell by cell</text></g>
<line x1="200" y1="76" x2="200" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="76" x2="480" y2="118" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="170" y="120" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">load_raw_tables</text>
<text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">application.csv + 5 history tables</text></g>
<line x1="340" y1="176" x2="340" y2="208" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="170" y="210" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">assemble_features</text>
<text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">features/*.py → the 23 model features</text></g>
<line x1="340" y1="266" x2="340" y2="298" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="170" y="300" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="318" text-anchor="middle" dominant-baseline="central">score_applicants</text>
<text class="ts" x="340" y="336" text-anchor="middle" dominant-baseline="central">model.predict_proba → pdo_scorecard</text></g>
<line x1="220" y1="356" x2="220" y2="388" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="356" x2="460" y2="388" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="110" y="390" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="408" text-anchor="middle" dominant-baseline="central">build_band_summary</text>
<text class="ts" x="220" y="426" text-anchor="middle" dominant-baseline="central">Per-band counts, means</text></g>
<g class="c-teal"><rect x="350" y="390" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="408" text-anchor="middle" dominant-baseline="central">explain_contributions</text>
<text class="ts" x="460" y="426" text-anchor="middle" dominant-baseline="central">Reason codes (CLI only)</text></g>
<line x1="220" y1="446" x2="220" y2="478" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="446" x2="460" y2="478" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="140" y="480" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="498" text-anchor="middle" dominant-baseline="central">BatchOutput/&lt;date&gt;/</text>
<text class="ts" x="340" y="516" text-anchor="middle" dominant-baseline="central">scored_applicants · band_summary · reason_codes</text></g>
<rect class="c-purple" x="70" y="560" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="88" y="566" dominant-baseline="central">Entry point</text>
<rect class="c-teal" x="230" y="560" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="248" y="566" dominant-baseline="central">Shared code (utils, features)</text>
<rect class="box" x="470" y="560" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="488" y="566" dominant-baseline="central">Data files</text>
</svg>
