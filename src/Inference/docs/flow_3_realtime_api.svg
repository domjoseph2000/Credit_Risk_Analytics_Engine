<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img"><title>Real-time API scoring flow</title><desc>On startup the API loads the model, explainer and history tables once. Each POST /score request is validated, matched to its history rows, turned into features, scored and explained, returning JSON or HTTP 422 if a feature is missing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect.box{fill:#F1EFE8;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th,.c-purple>.t{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style></defs>
<rect x="0" y="0" width="680" height="670" fill="#FFFFFF"/>
<rect x="40" y="20" width="600" height="108" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">On startup: loaded once, reused by every request</text>
<g class="c-teal"><rect x="49" y="56" width="186" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="142" y="74" text-anchor="middle" dominant-baseline="central">load_model</text>
<text class="ts" x="142" y="92" text-anchor="middle" dominant-baseline="central">@prod from MLflow</text></g>
<g class="c-teal"><rect x="247" y="56" width="186" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="74" text-anchor="middle" dominant-baseline="central">load_explainer</text>
<text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">SHAP explainer</text></g>
<g class="c-teal"><rect x="445" y="56" width="186" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="538" y="74" text-anchor="middle" dominant-baseline="central">load_shared_history</text>
<text class="ts" x="538" y="92" text-anchor="middle" dominant-baseline="central">~30M history rows</text></g>
<g><rect class="box" x="140" y="160" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="178" text-anchor="middle" dominant-baseline="central">POST /score</text>
<text class="ts" x="300" y="196" text-anchor="middle" dominant-baseline="central">Form fields from web/realtime</text></g>
<line x1="300" y1="216" x2="300" y2="238" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="240" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="258" text-anchor="middle" dominant-baseline="central">realtime_api.score</text>
<text class="ts" x="300" y="276" text-anchor="middle" dominant-baseline="central">Validate, pick applicant's history</text></g>
<line x1="300" y1="296" x2="300" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="320" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="338" text-anchor="middle" dominant-baseline="central">assemble_features</text>
<text class="ts" x="300" y="356" text-anchor="middle" dominant-baseline="central">Same code as batch</text></g>
<path d="M460 348 L560 348 L560 358" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="490" y="360" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="378" text-anchor="middle" dominant-baseline="central">HTTP 422</text>
<text class="ts" x="560" y="396" text-anchor="middle" dominant-baseline="central">Feature missing</text></g>
<line x1="300" y1="376" x2="300" y2="398" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="400" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="418" text-anchor="middle" dominant-baseline="central">score_applicants</text>
<text class="ts" x="300" y="436" text-anchor="middle" dominant-baseline="central">PD → score → band</text></g>
<line x1="300" y1="456" x2="300" y2="478" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="480" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="498" text-anchor="middle" dominant-baseline="central">explain_contributions</text>
<text class="ts" x="300" y="516" text-anchor="middle" dominant-baseline="central">Top 5 reason codes</text></g>
<line x1="300" y1="536" x2="300" y2="558" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="140" y="560" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="578" text-anchor="middle" dominant-baseline="central">ScoreResponse (JSON)</text>
<text class="ts" x="300" y="596" text-anchor="middle" dominant-baseline="central">PD, score, band, reasons, history flag</text></g>
<rect class="c-purple" x="70" y="640" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="88" y="646" dominant-baseline="central">API code</text>
<rect class="c-teal" x="230" y="640" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="248" y="646" dominant-baseline="central">Shared code (utils, features)</text>
<rect class="box" x="470" y="640" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="488" y="646" dominant-baseline="central">Request / response</text>
</svg>
