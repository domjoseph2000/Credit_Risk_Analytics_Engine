# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# Convenience wrapper for local development.
#
# Usage:
#   docker compose up --build
#   Then open http://localhost:8080 (admin / admin)
#   Trigger the DAG: Airflow UI → DAGs → 01_preprocessing → Trigger
#
# Set DATA_PATH to point at your local data directory:
#   DATA_PATH=/your/path docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: homecredit-pipeline:latest
    container_name: homecredit_pipeline
    ports:
      - "8080:8080"
    volumes:
      # Mount your data directory (Parquet files and Notebook logs will sync here)
      - "${DATA_PATH:-./data}:/data"
      
      # Mount your source code (The 7 Jupyter Notebooks live here)
      - "${SRC_PATH:-./src}:/src"
      
      # The Live-Sync Bridge (Your Python DAG updates instantly)
      - "./dags:/opt/airflow/dags"
      
      # Persist Airflow state (The SQLite database lives here)
      - airflow_db:/opt/airflow
    environment:
      HOMECREDIT_DATA_ROOT: /data
      # Training notebooks log runs/models through the mlflow service below
      # (by service name -- containers on this network can't use localhost)
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_ADMIN_USER: admin
      AIRFLOW_ADMIN_PASSWORD: admin
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Airflow 3.x removed SequentialExecutor -- it's silently rewritten to
      # LocalExecutor at config-load time regardless of what's set here. Made
      # explicit below, and constrained to run one task at a time since the
      # local SQLite metadata DB doesn't handle concurrent writes safely
      # (LocalExecutor's default parallelism=32 caused racy task-state writes
      # and missed heartbeats under load -- see task_instance_heartbeat_timeout
      # below).
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: 1
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      # Default is 300s -- too short for long-running notebook tasks (e.g. the
      # hyperparameter-tuning DAG's 150-eval Hyperopt search), which can go
      # quiet long enough under CPU load to get killed as a zombie task even
      # though they're still working. Raised to 30 minutes.
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: 1800
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 300
      
    depends_on:
      - mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ─── ADDED MLFLOW TRACKER SERVICE ──────────────────────────────────────────
  mlflow:
    image: python:3.12-slim
    container_name: homecredit_mlflow
    ports:
      - "5000:5000"
    volumes:
      # Grabs the EXACT same data directory so it can watch the mlruns folder
      - "${DATA_PATH:-./data}:/data"
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
    # Tracking server: metadata in /data/mlflow.db (SQLite); artifacts are
    # uploaded/downloaded THROUGH this server (--serve-artifacts) and stored
    # under /data/mlruns. Clients only ever see mlflow-artifacts:/ URIs, so the
    # same runs and registered models work from Windows (localhost:5000) and
    # from the pipeline container (mlflow:5000) -- no /data path baked in.
    # --allowed-hosts: MLflow rejects unknown Host headers; "mlflow" is how
    # the pipeline container addresses this service.
    # mlflow pinned to the pipeline image's version (Dockerfile) so client and
    # server agree.
    command: >
      bash -c "pip install mlflow==3.12.0 && mlflow server
      --backend-store-uri sqlite:////data/mlflow.db
      --serve-artifacts --artifacts-destination /data/mlruns
      --host 0.0.0.0 --port 5000
      --allowed-hosts 'localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000'"
    restart: unless-stopped
    
volumes:
  airflow_db:
  notebook_outputs:
  mlruns:
